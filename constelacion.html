    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;
}

body {
  height: 100vh;
  font-family: "Segoe UI", sans-serif;
  color: white;
  background-color: black;
  overflow: hidden;
}

/* Canvas de fondo: cubre toda la pantalla, detrás de todo */
#starCanvasBg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;       /* queda detrás de todo el contenido */
  display: block;
  background: #00000a;
}

/* ── BOTÓN MÚSICA ── */
.music-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.06);
  color: white;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  z-index: 50;
}

.music-btn i {
  display: flex;
  align-items: center;
  justify-content: center;
}

.music-btn:hover {
  background: rgba(255, 255, 255, 0.12);
}

@media (min-width: 600px) {
  .music-btn {
    top: 20px;
    right: 24px;
    width: 42px;
    height: 42px;
    font-size: 1.1rem;
  }

  .music-btn i {
    font-size: 20px;
  }
}

/* ── CONTENEDOR PRINCIPAL ── */
.container {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── ENCABEZADO ── */
.header {
  text-align: center;
  padding-top: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  position: relative;
  z-index: 10;
}

@media (min-width: 600px) {
  .header {
    padding-top: 22px;
    gap: 8px;
  }
}

.title {
  font-family: "Dancing Script", cursive;
  font-size: 1.8rem;
  font-weight: 700;
}

@media (min-width: 600px) {
  .title {
    font-size: 2.8rem;
  }
}

.subtitle {
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.55);
  line-height: 1.45;
}

@media (min-width: 600px) {
  .subtitle {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.6);
    line-height: normal;
  }
}

/* ── CONSTELACIÓN ── */
.constellation {
  flex: 1;
  width: 100%;
  position: relative;
}

/* ── CANVAS ── */
#starCanvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── ÍCONOS DE ESTRELLAS ── */
.star-icon {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 1.2rem;
  cursor: pointer;
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
  transition: transform 0.2s, filter 0.2s;
}

.star-icon:hover {
  transform: translate(-50%, -50%) scale(1.4);
  filter: drop-shadow(0 0 10px rgba(255, 200, 255, 0.9));
}

/* ── HINT ── */
.hint {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.65);
}

@media (min-width: 600px) {
  .hint {
    bottom: 24px;
    left: 24px;
    transform: none;
    font-size: 0.875rem;
    color: rgba(255, 255, 255, 0.7);
    padding: 10px 18px;
  }
}

/* ── MODAL ────────────────────────────────────────────────────── */

/* Mobile: centrada en pantalla */
.star-modal {
  position: fixed;
  top: 50%;
  left: 12px;
  right: 12px;
  width: auto;
  transform: translateY(-50%);

  /* Fondo: negro espacial con tinte azul-morado muy oscuro */
  background: rgba(6, 4, 20, 0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  /* Borde con brillo sutil tipo nebulosa */
  border: 1px solid rgba(160, 120, 255, 0.25);
  border-radius: 18px;
  padding: 16px;

  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 100;

  /* Sombra exterior con tinte morado, como si irradiara luz */
  box-shadow:
    0 0 0 1px rgba(100, 60, 200, 0.1),
    0 8px 32px rgba(0, 0, 0, 0.6),
    0 0 60px rgba(120, 80, 220, 0.08);

  /* Animación de entrada */
  animation: modalIn 0.25s ease-out;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(calc(-50% + 10px)); }
  to   { opacity: 1; transform: translateY(-50%); }
}

/* Desktop: esquina inferior derecha */
@media (min-width: 600px) {
  .star-modal {
    top: auto;
    bottom: 24px;
    left: auto;
    right: 24px;
    width: 290px;
    transform: none;
    padding: 20px;
    gap: 14px;
    animation: modalInDesktop 0.25s ease-out;
  }

  @keyframes modalInDesktop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
}

/* ── Botón cerrar ── */
.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.45);
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}

.modal-close:hover {
  background: rgba(255, 255, 255, 0.12);
  color: white;
}

/* ── Header: icono + título ── */
.modal-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 28px;
}

.modal-star-icon {
  color: #c084fc;
  font-size: 1rem;
  filter: drop-shadow(0 0 4px rgba(192, 132, 252, 0.6));
}

.modal-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.92);
  letter-spacing: 0.01em;
}

/* ── Imagen ── */
.modal-img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  border-radius: 10px;

 
  border: 1px solid rgba(160, 120, 255, 0.15);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
}

@media (min-width: 600px) {
  .modal-img {
    height: 150px;
  }
}

/* ── Descripción ── */
.modal-desc {
  font-size: 0.8rem;
  color: rgba(210, 195, 255, 0.75); 
  line-height: 1.6;
}

@media (min-width: 600px) {
  .modal-desc {
    font-size: 0.875rem;
  }

/* ── Fecha ── */
.modal-date {
  font-size: 0.72rem;
  color: rgba(160, 130, 220, 0.45);
  letter-spacing: 0.03em;
  font-style: italic;

@media (min-width: 600px) {

    font-size: 0.78rem;
  }

.star-icon {
  font-size: 14px; 
  animation: starPulse 2.5s ease-in-out infinite;
}

@keyframes starPulse {
  0%, 100% {
    text-shadow: 0 0 6px #fff, 0 0 14px #fff, 0 0 28px rgba(200, 220, 255, 0.6);
    filter: brightness(1);
  }
  50% {
    text-shadow: 0 0 10px #fff, 0 0 24px #fff, 0 0 48px rgba(180, 210, 255, 0.9);

  canvas.height = parent.offsetHeight;
  draw();
}

// ── HELPER: % a px ─────────────────────────────────────
function toPixel(star) {
  return {
    px: (star.x / 100) * canvas.width,
    py: (star.y / 100) * canvas.height,
  };
}

// ── ÍCONOS DE ESTRELLAS ────────────────────────────────
function renderStarIcons(stars) {
  document.querySelectorAll(".star-icon").forEach((el) => el.remove());

  stars.forEach((star) => {
    const { px, py } = toPixel(star);

    const icon = document.createElement("i");
    icon.className = "ri-star-fill star-icon";
    icon.style.left = px + "px";
    icon.style.top = py + "px";

    icon.addEventListener("click", () => showModal(star));
    canvas.parentElement.appendChild(icon);
  });
}

// ── LÍNEA CON GLOW ─────────────────────────────────────
function drawGlowLine(x1, y1, x2, y2) {
  ctx.save();

  ctx.shadowColor = "rgba(180, 210, 255, 0.6)";
  ctx.shadowBlur = 12;
  ctx.strokeStyle = "rgba(255,255,255,0.18)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  ctx.shadowColor = "rgba(220, 235, 255, 0.9)";
  ctx.shadowBlur = 6;
  ctx.strokeStyle = "rgba(255,255,255,0.75)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  ctx.restore();
}

// ── DIBUJO ─────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const stars = getStars();

  stars.forEach((star) => {
    const { px, py } = toPixel(star);
    star.connections.forEach((targetIndex) => {
      const { px: tx, py: ty } = toPixel(stars[targetIndex]);
      drawGlowLine(px, py, tx, ty);
    });
  });

  renderStarIcons(stars);
}

// ── MODAL ──────────────────────────────────────────────
function showModal(star) {
  document.querySelector(".star-modal")?.remove();

  const modal = document.createElement("div");
  modal.className = "star-modal";
  modal.innerHTML = `
    <button class="modal-close"><i class="ri-close-line"></i></button>
    <div class="modal-header">
      <span class="modal-star-icon">★</span>
      <h3 class="modal-title">${star.label}</h3>
    </div>
    ${star.image ? `<img class="modal-img" src="${star.image}" alt="${star.label}" />` : ""}
    <p class="modal-desc">${star.description}</p>
    <span class="modal-date">${star.date}</span>
  `;

  document.body.appendChild(modal);
  modal
    .querySelector(".modal-close")
    .addEventListener("click", () => modal.remove());
}

// ── INIT ───────────────────────────────────────────────
window.addEventListener("resize", resize);
resize();

(function () {
  const canvas = document.getElementById("starCanvasBg");
  const ctx = canvas.getContext("2d");

  // ── Configuración ──────────────────────────────────────────────
  const CONFIG = {
    starCount: 880, // cantidad de estrellas de fondo
    shootingStarInterval: 1000, // ms entre estrellas fugaces
    twinkleSpeed: 10.4, // velocidad base del parpadeo
    nebulaOpacity: 0.13, // opacidad de las nubes nebulosas
  };

  // ── Resize ─────────────────────────────────────────────────────
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    buildNebula(); // recalcula posiciones al cambiar tamaño
  }

  // ── Estrellas de fondo ─────────────────────────────────────────
  function makeStars(count) {
    return Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: CONFIG.twinkleSpeed + Math.random() * 0.5,
      warm: Math.random() > 0.75, // algunas con tinte cálido
    }));
  }

  let stars = [];

  // ── Nebulosas ──────────────────────────────────────────────────
  let nebulae = [];

  function buildNebula() {
    const W = canvas.width,
      H = canvas.height;
    nebulae = [
      {
        x: 0.12 * W,
        y: 0.25 * H,
        r: Math.min(W, H) * 0.22,
        rgb: [70, 30, 140],
      },
      { x: 0.8 * W, y: 0.6 * H, r: Math.min(W, H) * 0.18, rgb: [30, 10, 110] },
      { x: 0.5 * W, y: 0.85 * H, r: Math.min(W, H) * 0.15, rgb: [55, 10, 95] },
      {
        x: 0.65 * W,
        y: 0.15 * H,
        r: Math.min(W, H) * 0.12,
        rgb: [90, 40, 130],
      },
    ];
  }

  function drawNebulae() {
    nebulae.forEach(({ x, y, r, rgb }) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(
        0,
        `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${CONFIG.nebulaOpacity})`,
      );
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // ── Estrellas fugaces ──────────────────────────────────────────
  let shooters = [];

  function spawnShooter() {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    shooters.push({
      x,
      y,
      len: 120 + Math.random() * 80,
      progress: 0,
      speed: 4 + Math.random() * 3,
    });
  }

  function drawShooters() {
    shooters = shooters.filter((s) => s.progress < 1);
    shooters.forEach((s) => {
      s.progress += s.speed / (s.len * 10);
      const alpha = Math.sin(s.progress * Math.PI);
      const tailX = s.x + s.progress * s.len;
      const tailY = s.y + s.progress * s.len * 0.4;

      const g = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
      g.addColorStop(0, `rgba(255,245,255,0)`);
      g.addColorStop(1, `rgba(255,245,255,${alpha * 0.9})`);

      ctx.strokeStyle = g;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
    });
  }

  // ── Loop principal ─────────────────────────────────────────────
  let t = 0;

  function draw() {
    const W = canvas.width,
      H = canvas.height;

    // Fondo negro profundo
    ctx.fillStyle = "#00000a";
    ctx.fillRect(0, 0, W, H);

    // Nebulosas
    drawNebulae();

    // Estrellas de fondo
    stars.forEach((s) => {
      const tw = 0.55 + 0.45 * Math.sin(t * s.speed + s.phase);

      // Halo difuso
      const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 5);
      if (s.warm) {
        glow.addColorStop(0, `rgba(255,220,180,${0.18 * tw})`);
      } else {
        glow.addColorStop(0, `rgba(200,180,255,${0.22 * tw})`);
      }
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 5, 0, Math.PI * 2);
      ctx.fill();

      // Núcleo de la estrella
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * tw, 0, Math.PI * 2);
      ctx.fillStyle = s.warm
        ? `rgba(255,235,200,${0.7 + 0.3 * tw})`
        : `rgba(240,225,255,${0.7 + 0.3 * tw})`;
      ctx.fill();
    });

    // Estrellas fugaces
    drawShooters();

    t += 0.016;
    requestAnimationFrame(draw);
  }

  // ── Init ───────────────────────────────────────────────────────
  function init() {
    resize();
    stars = makeStars(CONFIG.starCount);
    draw();
    setInterval(spawnShooter, CONFIG.shootingStarInterval);
  }

  window.addEventListener("resize", () => {
    resize();
    stars = makeStars(CONFIG.starCount);
  });

  init();
})();


document.addEventListener("click", () => {
  const musica = document.getElementById("musicaFondo");
  musica.play();
}, { once: true });



    </script>
</body>
