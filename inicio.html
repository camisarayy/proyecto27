.boton {
  background-color: #ea0881;
  border: 3px solid;
  color:#ffe6f0;
  padding: 15px 50px;
  font-size: 1,4rem;
  border-radius: 12px;
  font-family: sans-serif;
  font-size: xx-large;
  display: flex;
  align-items: center;
  justify-content: center;
  display: inline-block;
  text-shadow: 1px 2px #0b0606;
  
}

.boton:hover {
  background-color: rgb(6, 91, 6);
  box-shadow: 0 0 20px var (--color);
  border-color: #e07acc;
}

.boton span:nth-child(n){
        position: absolute;
        width: 10px;
        height: 10px;
        border: 3px solid;
        transition: all 0.6s ease;
        
    }

    .boton span:nth-child(1){
        right: 10%;
        top: -10px;
        background-color: #ffe6f0;
    }

    .boton span:nth-child(2){
        left: 10%;
        bottom: -10px;
        background-color: #ffe6f0;
        
    }
   
.boton span:nth-child(1){
        right: 80%;
        transform: rotate(90deg);
        color: var(--color);
        background-color: var(--color);
        
    }

     .boton span:nth-child(2){
        left: 80%;
        transform: rotate(90deg);
        color: var(--color);
        
    }
