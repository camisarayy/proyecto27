<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="siguiente.css">
    <title>Document</title>
</head>
<style>
    body{    
       margin: 0; 
       padding: 0;
       min-height: 100vh;
       display: flex;
       align-items: center;
       justify-content: center;
       background: #0b1522;
    }
    .heart{ 
        height: 150px;
        width: 150px;
        background-color: rgb(223, 32, 191);
        position: relative;
        transform: rotate(45deg);
        box-shadow: -20px 20px 150px rgb(223, 32, 191);
        animation: palpitar 0.5s linear infinite alternate;
    
    }
    .contenido{
        position: fixed;
        margin-bottom: 50px;
        text-align: center;
        

    }
    h1{color: aliceblue;}

    h2{color:aliceblue;}
    @keyframes palpitar{
        0%{transform: rotate(45deg) scale(1.10);}
        80%{transform: rotate(45deg) scale(1.0);}
        100%{transform: rotate(45deg) scale(0.8);}
    }
    .heart::before{
        content: "";
        position: absolute;
        height: 150px;
        width: 150px;
        background: rgb(223, 32, 191);
        right: 50%;
        border-radius: 50%;
        box-shadow: 20px 20px 150px rgb(223, 32, 191);

    }
    .heart::after{
        content: "";
        position: absolute;
        height: 150px;
        width: 150px;
        background: rgb(223, 32, 191);
        top: -50%;
        border-radius: 50%;
        box-shadow: 20px 20px 150px rgb(223, 32, 191);

    }

    .boton{
     background-color: rgb(255, 0, 149);
        border: 3px solid;
        color: #ffe6f0;
        padding: 15px 50px;
        font-size: 1,4rem;
        border-radius: 12px;
        font-family: sans-serif;
        font-size: xx-large;
        position: absolute;
        height: 100vh;
    }

.contenedor{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}
.boton{
position: absolute;
top:75%;
left: 50%;
transform: translateX(-50%);
height: auto;
padding: 10px 20px;
width: auto;
display: inline-block;
}


.boton:hover {
        background-color: rgb(15, 121, 35);
        box-shadow: 0 0 20px var (--color);
        border-color: rgb(241, 138, 217);
    }

    .boton span:nth-child(n){
        position: absolute;
        width: 10px;
        height: 10px;
        border: 3px solid;
        transition: all 0.6s ease;
        
    }

    .boton span:nth-child(1){
        right: 10%;
        top: -10px;
        background-color: #ffe6f0;
    }

    .boton span:nth-child(2){
        left: 10%;
        bottom: -10px;
        background-color: #ffe6f0;
        
    }
   
.boton span:nth-child(1){
        right: 80%;
        transform: rotate(90deg);
        color: var(--color);
        background-color: var(--color);
        
    }

     .boton span:nth-child(2){
        left: 80%;
        transform: rotate(90deg);
        color: var(--color);
        
    }


</style>
<body>

    <div class="heart"></div>
    <div class="contenido"><h1>TE AMO<h2></h2></div>
    <div class="audio-container">
        <audio autoplay loop>
        <source src="audio/Ojitos lindos Inicio.mp3" type="audio/mpeg">
        </audio>
       </div>
       <div> 
       <a href="gato.html" class="boton">Estas preparado??💗💚</a>
       
    </div>
         
        
</body>

    
    
</html>
